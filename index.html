<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & packing Planner</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class = "container">
        <header>
            <h1>☁️ Weather & PackingPlanner</h1>
            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search city..."
                >
                <button id="searchBtn">
                    Search
                </button>
                <button id="unitBtn">
                    °C
                </button>
            </div>
        </header>
        <div id ="error" class="hidden"></div>
        <div id="loading" class="hidden loader">
            Loading weather...  </div>
        <section class="dashboard">
            <div id="currentWeather" class="card"></div>
            <div id="packingCard" class="card"></div>
        </section>
        <section id="forecast" class="forecast"></section>
    </div>
<script type="module" src="js/main.js"></script>
</body>
</html>
